name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 89.19.214.60
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: /var/www/deploy.sh
